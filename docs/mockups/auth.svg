<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-label="Shared login and registration"><rect width="1100" height="820" fill="#f6f7f9"/><g font-family="Arial, Helvetica, sans-serif"><rect width="1100" height="72" fill="#182b49"/><text x="52" y="46" font-size="25" fill="#fff" font-weight="700">H  HuskyKit</text><text x="550" y="44" font-size="17" fill="#fff" font-weight="400">Home     Campus Life     Academic     Log in</text><text x="52" y="116" font-size="12" fill="#b42333" font-weight="700">DESIGN MOCKUP  /  CHUNZHANG LIU</text><text x="52" y="162" font-size="32" fill="#182b49" font-weight="700">Shared login and registration</text><rect x="306" y="210" width="488" height="533" rx="10" fill="#fff" stroke="#d6dde6"/><text x="338" y="255" font-size="25" fill="#182b49" font-weight="700">Create an account</text><text x="338" y="289" font-size="15" fill="#526174" font-weight="400">Browse freely. Sign in to share experiences.</text><text x="338" y="327" font-size="14" fill="#526174" font-weight="700">Display name</text><rect x="338" y="339" width="424" height="45" rx="10" fill="#fff" stroke="#d6dde6"/><text x="350" y="367" font-size="15" fill="#182b49" font-weight="400">Your name</text><text x="338" y="410" font-size="14" fill="#526174" font-weight="700">Username</text><rect x="338" y="422" width="424" height="45" rx="10" fill="#fff" stroke="#d6dde6"/><text x="350" y="450" font-size="15" fill="#182b49" font-weight="400">Letters, numbers, underscores</text><text x="338" y="493" font-size="14" fill="#526174" font-weight="700">Password</text><rect x="338" y="505" width="424" height="45" rx="10" fill="#fff" stroke="#d6dde6"/><text x="350" y="533" font-size="15" fill="#182b49" font-weight="400">At least 8 characters</text><rect x="338" y="586" width="424" height="44" rx="10" fill="#b42333" stroke="#d6dde6"/><text x="356" y="614" font-size="15" fill="#fff" font-weight="700">Create account</text><text x="338" y="674" font-size="16" fill="#b42333" font-weight="400">Already registered? Log in</text><text x="338" y="711" font-size="14" fill="#526174" font-weight="400">After login, return to the requested form.</text><text x="52" y="792" font-size="13" fill="#526174" font-weight="400">HuskyKit · Project 3 · Illustrative content; synthetic examples are labeled in the app.</text></g></svg>
